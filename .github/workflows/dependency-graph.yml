name: Dependency graph

on:
  push:
    # This fork's default branch is staging. GitHub updates the dependency graph only from
    # snapshots of the default branch; a snapshot of main is stored but answers ACCEPTED.
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-graph-staging
  cancel-in-progress: false

jobs:
  submit:
    if: github.ref == 'refs/heads/staging' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Install submission dependencies without lifecycle scripts
        run: pnpm install --filter . --frozen-lockfile --ignore-scripts
      - name: Check dependency snapshot construction
        run: node --test scripts/ci/dependency-graph*.test.mjs
      - name: Submit both dependency graphs for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/dependency-graph.mjs --submit
