name: Stagehand

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: stagehand
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      KANEO_E2E_TLS: "true"
      COMPOSE_FILE: tests/e2e/compose.yml:tests/e2e/compose.tls.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Classify Stagehand changes
        id: classify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/stagehand-change-classification.mjs

      - name: Decide whether to run Stagehand
        id: gate
        env:
          SKIP_STAGEHAND: ${{ steps.classify.outputs.skip_stagehand }}
        run: |
          if [ "$SKIP_STAGEHAND" = 'true' ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.gate.outputs.run == 'true'
        with:
          version: 12.18.0
      - run: pnpm --dir tests/e2e install --frozen-lockfile --ignore-scripts
        if: steps.gate.outputs.run == 'true'

      - name: Check browser-test dependency security regressions
        if: steps.gate.outputs.run == 'true'
        run: pnpm --dir tests/e2e test:security

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.gate.outputs.run == 'true'
      - name: Build this revision of Kaneo
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.kaneo
          load: true
          tags: kaneo-stagehand:test
          cache-from: type=gha,scope=stagehand
          cache-to: type=gha,mode=max,scope=stagehand

      - name: Check Stagehand Chromium
        if: steps.gate.outputs.run == 'true'
        run: pnpm --dir tests/e2e setup
      - name: Create disposable test certificate
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p .cache/e2e-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout .cache/e2e-tls/key.pem -out .cache/e2e-tls/cert.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost'
      - name: Start disposable test instance
        if: steps.gate.outputs.run == 'true'
        run: docker compose up --no-build --wait --wait-timeout 180
      - name: Run browser smoke tests
        if: steps.gate.outputs.run == 'true'
        run: pnpm test:e2e

      - name: Collect instance logs
        if: failure() && steps.gate.outputs.run == 'true'
        run: |
          mkdir -p .cache/e2e
          docker compose logs --no-color > .cache/e2e/instance.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: stagehand-results
          path: .cache/e2e/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop disposable test instance
        if: always() && steps.gate.outputs.run == 'true'
        run: docker compose down --volumes
