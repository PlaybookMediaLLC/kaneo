services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaneo}
      POSTGRES_DB: ${POSTGRES_DB:-kaneo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  kaneo:
    # Pin KANEO_VERSION in .env (e.g. KANEO_VERSION=v2.4.0) so upgrades and rollbacks are deterministic.
    image: ghcr.io/playbookmediallc/kaneo:${KANEO_VERSION:-latest}
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      # Single-host default: zero-S3 local filesystem uploads persisted on the uploads_data volume.
      # Set STORAGE_DRIVER=s3 and S3_* variables in .env when scaling horizontally.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

#  Optional for HA Setup
#  redis:
#    image: valkey/valkey:8-alpine
#    ports:
#      - "6379:6379"

volumes:
  postgres_data:
  uploads_data:
